<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Coming Soon</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117; /* GitHub's Dark Mode Color */
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 1px solid #30363d;
            padding: 2rem;
            border-radius: 6px;
            background-color: #161b22;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 10px;
        }
        p {
            color: #8b949e;
            font-size: 1.1rem;
        }
        .spinner {
            border: 4px solid rgba(88, 166, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #58a6ff;
            animation: spin 1s ease infinite;
            display: inline-block;
            margin-top: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1></h1>
        <p>Working on my current portfolio.</p>
        <div class="spinner"></div>
    </div>
</body>
</html>
